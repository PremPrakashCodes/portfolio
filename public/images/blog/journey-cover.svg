<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
  </g>
  <!-- Path/journey line -->
  <path d="M100,500 C250,480 300,350 400,320 S550,200 650,280 S800,380 900,200 S1000,150 1100,130"
        stroke="url(#accent)" stroke-width="3" fill="none" stroke-opacity="0.6" stroke-linecap="round"/>
  <!-- Milestone dots along the path -->
  <circle cx="100" cy="500" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="400" cy="320" r="6" fill="#f97316" opacity="0.8"/>
  <circle cx="650" cy="280" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="900" cy="200" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="1100" cy="130" r="8" fill="#ef4444" opacity="0.9"/>
  <!-- Glow at the end -->
  <circle cx="1100" cy="130" r="40" fill="#ef4444" opacity="0.08"/>
  <circle cx="1100" cy="130" r="20" fill="#ef4444" opacity="0.12"/>
  <!-- Code bracket decorations -->
  <text x="150" y="200" font-family="monospace" font-size="80" fill="#ffffff" opacity="0.06">{</text>
  <text x="980" y="500" font-family="monospace" font-size="80" fill="#ffffff" opacity="0.06">}</text>
</svg>
